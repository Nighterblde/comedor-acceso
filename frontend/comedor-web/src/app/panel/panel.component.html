<header class="barra no-imprimir">
  <div>
    <p class="rotulo">Comedor de personal</p>
    <p class="pantalla">Panel del administrador</p>
  </div>
  <div class="sesion">
    <p class="rol">{{ auth.usuario() }} · {{ auth.rol() }}</p>
    @if (auth.finSesion(); as hora) {
      <p class="rol">Sesión hasta las {{ hora }}</p>
    }
  </div>
</header>

<div class="panel">
  <nav class="lateral no-imprimir" aria-label="Panel">
    @for (g of grupos; track g.titulo) {
      <h2 class="grupo">{{ g.titulo }}</h2>
      <ul>
        @for (e of g.enlaces; track e.ruta) {
          <li>
            <a [routerLink]="['/panel', e.ruta]" routerLinkActive="activo" ariaCurrentWhenActive="page">{{ e.etiqueta }}</a>
          </li>
        }
      </ul>
    }
  </nav>
  <main class="contenido">
    <div class="no-imprimir">
      <app-aviso-sincronizacion></app-aviso-sincronizacion>
    </div>
    <router-outlet></router-outlet>
  </main>
</div>
