<main class="pagina">
  <section class="tarjeta">
    <p class="rotulo">Comedor de personal</p>
    <h1>Iniciar sesión</h1>
    @if (punto) {
      <p class="punto">Entrada {{ punto }}</p>
    }

    <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
      <div class="campo">
        <label for="id">Número de empleado</label>
        <input id="id" type="text" formControlName="id" autocomplete="username"
               [attr.aria-describedby]="error ? 'error-login' : null" [attr.aria-invalid]="error ? true : null" />
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" type="password" formControlName="contrasena" autocomplete="current-password"
               [attr.aria-describedby]="error ? 'error-login' : null" [attr.aria-invalid]="error ? true : null" />
      </div>

      @if (error) {
        <p id="error-login" class="error" role="alert">{{ error }}</p>
      }

      <button type="submit" class="primario" [disabled]="enviando || formulario.invalid">
        {{ enviando ? 'Validando…' : 'Entrar' }}
      </button>
    </form>

    <p class="nota">Tu sesión se recuerda por 30 días en este celular.</p>
    <p class="nota">¿Problemas para entrar? Acude con el chef.</p>
  </section>
</main>
